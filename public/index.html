<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Decision Lab // Behavioral Economics Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="header-left">
        <!-- Left Menu Bar Toggle Button -->
        <button class="menu-toggle-btn" id="menuToggleBtn" onclick="window.toggleLeftMenu()" aria-label="Open Navigation Menu">
          <span class="menu-icon">☰</span>
          <span class="menu-text">Menu</span>
        </button>

        <div class="brand" onclick="window.navigateToSection('survey')">
          <span class="brand-badge">VERITAS</span>
          <div class="brand-title">Decision<span>Lab</span></div>
        </div>
      </div>

      <!-- Current Active Section Indicator -->
      <div class="header-right">
        <span class="current-section-badge" id="currentSectionBadge" onclick="window.toggleLeftMenu()" title="Click to open menu">
          🧠 Study
        </span>
      </div>
    </div>
  </header>

  <!-- Left Sidebar Drawer (Only shows when clicked on) -->
  <div class="menu-backdrop" id="menuBackdrop" onclick="window.closeLeftMenu()"></div>
  <aside class="sidebar-drawer" id="sidebarDrawer" aria-hidden="true">
    <div class="drawer-header">
      <div class="drawer-brand">
        <span class="brand-badge">VERITAS</span>
        <div class="drawer-title">Navigation<span>Menu</span></div>
      </div>
      <button class="drawer-close-btn" onclick="window.closeLeftMenu()" aria-label="Close menu">✕</button>
    </div>

    <div class="drawer-content">
      <div class="drawer-nav-section-title">SECTIONS & RESEARCH MODULES</div>

      <nav class="drawer-nav">
        <!-- 1. About the Project (Placed at the top) -->
        <button class="drawer-nav-item" id="menuItemAbout" onclick="window.navigateToSection('about')">
          <span class="drawer-nav-icon">💡</span>
          <div class="drawer-nav-text">
            <div class="drawer-nav-label">About the Project</div>
            <div class="drawer-nav-sub">Founder, Mission & Architecture</div>
          </div>
        </button>

        <!-- 2. Behavioral Test Section -->
        <button class="drawer-nav-item active" id="menuItemSurvey" onclick="window.navigateToSection('survey')">
          <span class="drawer-nav-icon">🧠</span>
          <div class="drawer-nav-text">
            <div class="drawer-nav-label">The Decision Lab</div>
            <div class="drawer-nav-sub">7-Scenario Behavioral Economics Study</div>
          </div>
        </button>

        <!-- 3. Research Analytics Section -->
        <button class="drawer-nav-item" id="menuItemAnalytics" onclick="window.navigateToSection('analytics')">
          <span class="drawer-nav-icon">📊</span>
          <div class="drawer-nav-text">
            <div class="drawer-nav-label">Research Analytics</div>
            <div class="drawer-nav-sub">Aggregate Data, Chi-Square & Exports</div>
          </div>
          <span class="drawer-lock-indicator" id="menuLockAnalytics">🔒</span>
        </button>

        <!-- 4. Political Market Predictor Section -->
        <button class="drawer-nav-item" id="menuItemMarket" onclick="window.navigateToSection('market')">
          <span class="drawer-nav-icon">⚡</span>
          <div class="drawer-nav-text">
            <div class="drawer-nav-label">Political Market Predictor</div>
            <div class="drawer-nav-sub">News NLP & Monte Carlo Simulator</div>
          </div>
          <span class="drawer-lock-indicator" id="menuLockMarket">🔒</span>
        </button>
      </nav>
    </div>

    <div class="drawer-footer">
      <div class="drawer-status-card" id="drawerStatusCard">
        <div class="drawer-status-row">
          <span class="status-dot locked" id="drawerStatusDot"></span>
          <span class="status-label" id="drawerStatusLabel">Researcher PIN: Locked</span>
        </div>
        <button class="btn-drawer-auth" id="drawerAuthBtn" onclick="window.drawerAuthAction()">
          Unlock Access (1661) →
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Viewport Container -->
  <main class="main-content" id="mainApp">
    <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
      <p style="font-family: var(--font-mono); font-size: 0.95rem;">Loading The Decision Lab...</p>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic (ES Module) -->
  <script type="module" src="/app.js"></script>
</body>
</html>
