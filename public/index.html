<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Everyday Decision Game // Behavioral Economics Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand" onclick="window.switchMode('survey')">
        <span class="brand-badge">VERITAS</span>
        <div class="brand-title">Decision<span>Game</span></div>
      </div>

      <div class="nav-actions">
        <!-- Live Telemetry Status Pill -->
        <div class="telemetry-pulse" id="telemetryStatus">
          <span class="pulse-dot"></span>
          Ready
        </div>

        <!-- Mode Toggle Switcher -->
        <div class="mode-toggle-group">
          <button class="mode-btn active" id="btnModeSurvey" onclick="window.switchMode('survey')">
            <span>Take Survey</span>
          </button>
          <button class="mode-btn" id="btnModeAnalytics" onclick="window.switchMode('analytics')">
            <span>Results & Data</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="main-content" id="mainApp">
    <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
      <p style="font-family: var(--font-mono); font-size: 0.9rem;">Loading Decision Game...</p>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic -->
  <script type="module" src="/app.js"></script>
</body>
</html>
