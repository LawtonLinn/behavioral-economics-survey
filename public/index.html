<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Everyday Decision Game // Behavioral Economics Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand" onclick="window.switchMode('survey')">
        <span class="brand-badge">VERITAS</span>
        <div class="brand-title">Decision<span>Game</span></div>
      </div>

      <!-- Navigation Tabs & Protected Access -->
      <div class="nav-actions">
        <button class="nav-tab-btn" id="navSurveyBtn" onclick="window.switchMode('survey')">
          <span>🧠</span>
          <span>Study</span>
        </button>
        <button class="nav-tab-btn" id="navMarketBtn" onclick="window.switchMode('market')">
          <span>⚡</span>
          <span>Market Predictor</span>
        </button>
        <button class="admin-lock-btn" id="adminLockBtn" onclick="window.promptAdminLogin()">
          <span id="adminLockIcon">🔒</span>
          <span id="adminLockText">Researcher</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="main-content" id="mainApp">
    <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
      <p style="font-family: var(--font-mono); font-size: 0.95rem;">Loading Decision Game...</p>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic (ES Module) -->
  <script type="module" src="/app.js"></script>
</body>
</html>
